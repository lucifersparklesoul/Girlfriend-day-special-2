.text-white\/90{color:rgba(255,255,255,.9)}.text-white\/60{color:rgba(255,255,255,.6)}

.bg-white\/80{background:rgba(255,255,255,.8)}.bg-white\/95{background:rgba(255,255,255,.95)}

.border{border:1px solid #fce7f3}
.border-pink-100{border-color:#fce7f3}.border-pink-200{border-color:#fbcfe8}.border-pink-50{border-color:#fdf2f8}
.border-white\/20{border-color:rgba(255,255,255,.2)}
.rounded-full{border-radius:999px}.rounded-2xl{border-radius:16px}.rounded-3xl{border-radius:24px}.rounded-xl{border-radius:12px}
.shadow-sm{box-shadow:0 1px 2px 0 rgba(0,0,0,.05)}
.shadow-md{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
.shadow-lg{box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
.shadow-xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.shadow-pink-200\/30{box-shadow:0 20px 25px -5px rgba(249,168,212,.3),0 8px 10px -6px rgba(249,168,212,.3)}
.shadow-rose-200{box-shadow:0 10px 15px -3px rgba(254,205,211,.75),0 4px 6px -4px rgba(254,205,211,.75)}
.shadow-pink-200{box-shadow:0 10px 15px -3px rgba(251,207,232,.75),0 4px 6px -4px rgba(251,207,232,.75)}
.shadow-fuchsia-200{box-shadow:0 10px 15px -3px rgba(245,208,254,.75),0 4px 6px -4px rgba(245,208,254,.75)}
.shadow-purple-200{box-shadow:0 10px 15px -3px rgba(233,213,255,.75),0 4px 6px -4px rgba(233,213,255,.75)}
.shadow-violet-200{box-shadow:0 10px 15px -3px rgba(221,214,254,.75),0 4px 6px -4px rgba(221,214,254,.75)}
.hover-shadow-xl:hover{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.backdrop-blur-sm{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.backdrop-blur-md{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.backdrop-blur-xl{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.transition-all{transition:all .3s}.transition-colors{transition:background-color .3s,color .3s,border-color .3s}
.transition-shadow{transition:box-shadow .3s}.duration-200{transition-duration:.2s}.duration-300{transition-duration:.3s}

/* ============================================================
   ANIMATIONS
============================================================ */
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin360{to{transform:rotate(360deg)}}
@keyframes giftBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes giftShake{0%{transform:rotate(0) scale(1)}20%{transform:rotate(10deg) scale(1.1)}40%{transform:rotate(-10deg) scale(.9)}60%{transform:rotate(10deg) scale(1.15)}80%{transform:rotate(-10deg) scale(.95)}100%{transform:rotate(0) scale(1)}}
@keyframes eqBar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes shimmerBg{0%{background-position:-200% center}100%{background-position:200% center}}
.animate-float{animation:floatY 3s ease-in-out infinite}
.animate-pulse-soft{animation:pulseSoft 2s ease-in-out infinite}
.animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
.animate-spin-slow{animation:spin360 4s linear infinite}
.animate-shimmer{background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);background-size:200% 100%;animation:shimmerBg 2s infinite}

/* ============================================================
   LOCK SCREEN
============================================================ */
#lock-screen{position:fixed;inset:0;z-index:100;background-image:linear-gradient(135deg,#ffe4e6,#fdf2f8,#fae8ff);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#lock-screen.gone{opacity:0;pointer-events:none}
.lock-heart{position:absolute;top:-20px;font-size:18px;user-select:none;pointer-events:none}
.lock-card{position:relative;z-index:10;width:100%;max-width:448px;margin:0 16px}
.lock-inner{background:rgba(255,255,255,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;box-shadow:0 25px 50px -12px rgba(249,168,212,.3);border:1px solid #fce7f3;padding:32px 32px 40px}
@media (min-width:1024px){.lock-inner{padding:40px}}
.lock-icon{display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:999px;background-image:linear-gradient(135deg,#fb7185,#ec4899);box-shadow:0 10px 15px -3px rgba(249,168,212,.3);font-size:48px}
.lock-icon.shake{animation:lockShake .5s}
@keyframes lockShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-15deg)}80%{transform:rotate(15deg)}}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:32px}
.pin-dot{width:20px;height:20px;border-radius:999px;border:2px solid #fbcfe8;transition:all .3s}
.pin-dot.filled{border-color:#ec4899;background:#ec4899;box-shadow:0 4px 6px -1px rgba(236,72,153,.4)}
.pin-dot.error{border-color:#f87171;background:#f87171;box-shadow:none}
.pin-dots.shake{animation:dotsShake .5s}
@keyframes dotsShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key-btn{height:56px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid #fce7f3;font-size:20px;font-weight:700;color:#374151;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);transition:all .2s}
.key-btn:hover{background:#fdf2f8;color:#ec4899;transform:scale(1.05);box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.key-btn:active{transform:scale(.9)}
.key-btn.delete{color:#9ca3af}
.key-btn.delete:hover{color:#ec4899;background:#fdf2f8}
.clear-btn{width:100%;margin-top:16px;padding:12px;border-radius:16px;font-size:14px;color:#9ca3af;transition:all .2s}
.clear-btn:hover{color:#ec4899;background:#fdf2f8}

/* ============================================================
   NAVIGATION
============================================================ */
.nav-desktop{position:fixed;top:0;left:0;right:0;z-index:40;display:none;justify-content:center;padding:12px 16px 0}
.nav-bar{position:relative;display:flex;gap:4px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:8px 12px;box-shadow:0 20px 25px -5px rgba(249,168,212,.3),0 8px 10px -6px rgba(249,168,212,.3);border:1px solid #fce7f3}
.nav-pill{position:absolute;top:8px;bottom:8px;left:0;width:0;border-radius:999px;background-image:linear-gradient(90deg,#f43f5e,#ec4899);box-shadow:0 4px 6px -1px rgba(236,72,153,.4);transition:left .45s cubic-bezier(.34,1.3,.5,1),width .45s cubic-bezier(.34,1.3,.5,1)}
.nav-link{position:relative;z-index:1;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:#4b5563;transition:color .3s;white-space:nowrap}
.nav-link:hover{color:#ec4899}
.nav-link.active{color:#fff}
.nav-link .nl-emoji{display:inline-flex;align-items:center;gap:6px}
@media (min-width:1024px){.nav-desktop{display:flex}}
.hamburger{position:fixed;top:16px;right:16px;z-index:60;display:flex;width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);border:1px solid #fbcfe8;align-items:center;justify-content:center}
.hamburger .hb-lines{display:flex;flex-direction:column;gap:6px}
.hamburger .hb-line{width:20px;height:2px;background:#ec4899;border-radius:999px;display:block;transition:transform .3s,opacity .3s}
.hamburger.open .hb-line:nth-child(1){transform:translateY(8px) rotate(45deg)}
.hamburger.open .hb-line:nth-child(2){opacity:0}
.hamburger.open .hb-line:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@media (min-width:1024px){.hamburger{display:none}}
.m-menu{position:fixed;top:0;right:0;bottom:0;width:288px;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:-25px 0 50px -12px rgba(0,0,0,.25);transform:translateX(100%);opacity:0;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s;display:flex;flex-direction:column;padding:96px 24px 24px;gap:12px}
.m-menu.open{transform:translateX(0);opacity:1}
.m-link{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:16px;font-size:16px;font-weight:500;color:#4b5563;transition:background-color .3s,color .3s,transform .45s,opacity .45s;transform:translateX(50px);opacity:0}
.m-menu.open .m-link{transform:translateX(0);opacity:1;transition-delay:calc(var(--i,0)*70ms)}
.m-link:hover{background:#fdf2f8;color:#ec4899}
.m-link.active{background-image:linear-gradient(90deg,#f43f5e,#ec4899);color:#fff;box-shadow:0 10px 15px -3px rgba(249,168,212,.3),0 4px 6px -4px rgba(249,168,212,.3)}
.m-link .ml-emoji{font-size:20px}
@media (min-width:1024px){.m-menu{display:none}}

/* ============================================================
   APP SHELL

#page{position:relative;z-index:1;min-height:100vh}
#page>.page-shell{max-width:1152px;margin-left:auto;margin-right:auto}
.heart-layer{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fall-heart{position:absolute;top:0;left:0;user-select:none;will-change:transform}

/* ============================================================
   HOME
============================================================ */
.float-strip{position:relative;height:128px;margin-bottom:32px;overflow:hidden}
.float-emoji{position:absolute;font-size:24px;user-select:none;pointer-events:none}
.count-tile{background-image:linear-gradient(135deg,#fb7185,#ec4899);border-radius:16px;padding:16px;box-shadow:0 10px 15px -3px rgba(249,168,212,.3),0 4px 6px -4px rgba(249,168,212,.3);text-align:center;min-width:70px;transition:transform .2s}
.count-tile:hover{transform:scale(1.05)}
.count-tile .num{display:block;font-size:30px;font-weight:700;color:#fff;line-height:1.25}
.count-tile .lbl{color:#fce7f3;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.025em}
@media (min-width:1024px){.count-tile{min-width:100px;padding:24px}.count-tile .num{font-size:48px}}
.home-card{display:block;border-radius:16px;padding:24px;color:#fff;text-align:center;height:100%;transition:transform .2s,box-shadow .3s}
.home-card:hover{transform:scale(1.03) translateY(-4px);box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.home-card:active{transform:scale(.98)}
.home-card .hc-emoji{font-size:36px;display:block;margin-bottom:12px}
.home-card h4{font-weight:600;font-size:18px}
.home-card p{color:rgba(255,255,255,.7);font-size:14px;margin-top:4px}

/* ============================================================
   LOVE NOTES
============================================================ */
.grid-notes{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:768px){.grid-notes{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.grid-notes{grid-template-columns:repeat(3,1fr)}}
.flip{perspective:1000px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:256px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.34,.9,.4,1)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-front{color:#fff;padding:24px}
.flip-front .ff-emoji{font-size:48px;margin-bottom:16px}
.flip-front h3{font-size:24px;font-weight:700}
.flip-front p{color:rgba(255,255,255,.6);font-size:14px;margin-top:8px}
.flip-back{background:#fff;border:1px solid #fce7f3;transform:rotateY(180deg);padding:24px}
.flip-back .fb-emoji{font-size:30px;margin-bottom:12px}
.flip-back h3{font-size:18px;font-weight:700;color:#1f2937;margin-bottom:8px}
.flip-back p{color:#6b7280;font-size:14px;line-height:1.625}

/* ============================================================
   GALLERY
============================================================ */
.masonry{columns:1;column-gap:16px}
.masonry>*{margin-bottom:16px;break-inside:avoid}
@media (min-width:768px){.masonry{columns:2}}
@media (min-width:1024px){.masonry{columns:3}}
.gallery-card{border-radius:16px;padding:24px;cursor:pointer;color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);transition:transform .2s,box-shadow .3s;text-align:center}
.gallery-card:hover{transform:scale(1.02) translateY(-4px);box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.gallery-card .gc-emoji{font-size:60px;display:block;margin-bottom:16px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.2))}
.gallery-card h3{font-size:20px;font-weight:700;margin-bottom:8px}
.gallery-card p{color:rgba(255,255,255,.7);font-size:14px;line-height:1.625}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox-card{border-radius:24px;padding:40px;max-width:512px;width:100%;color:#fff;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.lightbox-card .lb-emoji{font-size:96px;display:block;margin-bottom:24px;filter:drop-shadow(0 20px 12px rgba(0,0,0,.3))}
.lightbox-card h2{font-size:30px;font-weight:700;margin-bottom:16px}
.lightbox-card p{color:rgba(255,255,255,.8);font-size:18px;line-height:1.625;margin-bottom:24px}
.lightbox-card button{background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:10px 24px;border-radius:999px;font-weight:500;transition:background .2s}
.lightbox-card button:hover{background:rgba(255,255,255,.3)}

/* ============================================================
   TIMELINE
============================================================ */
.tl-item{position:relative}
.tl-row{position:relative;display:flex;align-items:center;margin-bottom:48px}
@media (min-width:1024px){.tl-row{margin-bottom:64px}}
.tl-track{display:none}
@media (min-width:1024px){
  .tl-track{display:block;position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background-image:linear-gradient(to bottom,#fda4af,#a5b4fc);border-radius:999px}
}
.tl-card{width:100%;background:rgba(255,255,255,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:16px;padding:24px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);border:1px solid #fce7f3}
.tl-card h3{font-size:20px;font-weight:700;color:#1f2937}
.tl-card .tl-sub{color:#ec4899;font-weight:500;font-size:14px;margin:4px 0 12px}
.tl-card p{color:#6b7280;font-size:14px;line-height:1.625}
.tl-icon{width:64px;height:64px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);position:relative;z-index:2}
.tl-desk{display:none}
@media (min-width:1024px){
  .tl-desk{display:flex;width:100%;align-items:center}
  .tl-desk .tl-col{width:41.6666667%}
  .tl-desk .tl-icol{width:16.6666667%;display:flex;justify-content:center;position:relative;z-index:2}
  .tl-row[data-dir="right"] .tl-desk{flex-direction:row-reverse}
  .tl-row[data-dir="left"] .tl-card{text-align:right}
}
.tl-mobile{display:flex;width:100%}
@media (min-width:1024px){.tl-mobile{display:none}}
.tl-mobile .tl-mline{width:48px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-right:16px}
.tl-mobile .tl-icon{width:48px;height:48px;font-size:20px}
.tl-mobile .tl-mline .tl-stem{width:2px;flex:1;min-height:32px;margin-top:8px;background-image:linear-gradient(to bottom,#fda4af,#a5b4fc);border-radius:999px}
.tl-item .tl-card,.tl-item .tl-mcard{opacity:0;transition:opacity .6s ease-out,transform .6s ease-out}
.tl-item .tl-icon{opacity:0;transform:scale(0);transition:opacity .5s cubic-bezier(.34,1.56,.64,1),transform .5s cubic-bezier(.34,1.56,.64,1)}
.tl-item.revealed .tl-card,.tl-item.revealed .tl-mcard{opacity:1;transform:translateX(0)}
.tl-item.revealed .tl-icon{opacity:1;transform:scale(1)}
.tl-row[data-dir="left"] .tl-card{transform:translateX(-50px)}
.tl-row[data-dir="right"] .tl-card{transform:translateX(50px)}
.tl-mcard{opacity:0;transform:translateX(20px);flex:1;background:rgba(255,255,255,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:16px;padding:20px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);border:1px solid #fce7f3;margin-bottom:16px}
.tl-mcard h3{font-size:18px;font-weight:700;color:#1f2937}
.tl-mcard .tl-sub{color:#ec4899;font-weight:500;font-size:14px;margin:4px 0 8px}
.tl-mcard p{color:#6b7280;font-size:14px;line-height:1.625}

/* ============================================================
   PLAYLIST
============================================================ */
.now-playing{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;padding:32px;box-shadow:0 20px 25px -5px rgba(249,168,212,.3),0 8px 10px -6px rgba(249,168,212,.3);border:1px solid #fce7f3;margin-bottom:32px}
.now-playing .np-disc{width:96px;height:96px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);flex-shrink:0}

function renderLockScreen() {

  $('#lock-screen').innerHTML =

    '</div>';

  var lock = $('#lock-screen');
  $$('.lock-heart', lock).forEach(function (el, i) {
    var drift1 = rand(0, 100), drift2 = rand(0, 100), drift3 = rand(0, 100);
    el.animate([
      { transform: 'translateY(0) translateX(0)', opacity: 0 },
      { opacity: 0.2, offset: 0.15 },
      { opacity: 0.2, offset: 0.85 },

function animateLockIcon() {

function updateDots() {
  $$('#pin-dots .pin-dot').forEach(function (dot, i) {
    dot.classList.toggle('filled', i < pin.length);
    dot.classList.toggle('error', pinError && i < pin.length);
  });

function updateStatus() {
  var status = $('#lock-status');

  if (pin.length === 4 && !pinError) {
    status.innerHTML = '<div class="text-center mb-6"><span style="display:inline-block;font-size:30px">\u2728</span><p class="text-pink-500 font-medium mt-1 animate-pulse" style="font-size:14px">Unlocking...</p></div>';
    err.innerHTML = '';
  } else {
    status.innerHTML = '';
    err.innerHTML = pinError
      ? '<p class="text-center text-red-400 font-medium mb-4" style="font-size:14px">Wrong PIN. Try again! \u{1F494}</p>'
      : '';
  }
}

function pressDigit(d) {
  if (pin.length >= 4 || unlocked) return;
  pin += d;
  updateDots();
  updateStatus();

  if (pin.length === 4) {
    if (pin === CORRECT_PIN) {
      var icon = $('#lock-icon');
      if (icon) icon.innerHTML = '\u{1F513}';
      pinTimers.push(setTimeout(function () { doUnlock(); }, 600));
    } else {
      pinError = true;
      updateDots();
      updateStatus();
      var dots = $('#pin-dots');
      var lic = $('#lock-icon');

      pinTimers.push(setTimeout(function () {
        pin = '';
        pinError = false;
        updateDots();
        updateStatus();
      }, 800));
    }

}

function handleDelete() {
  if (pin.length > 0) {
    pin = pin.slice(0, -1);
    if (pinError) { pinError = false; updateStatus(); }
    updateDots();
    updateStatus();
  }
}

function handleClear() {
  pin = '';

  updateStatus();
}

  el.className = 'fall-heart';
  el.style.left = rand(0, 100).toFixed(2) + '%';
  el.style.fontSize = rand(10, 30) + 'px';
  el.textContent = pick(HEART_EMOJIS);
  layer.appendChild(el);

  var opacity = rand(0.1, 0.5);
  var rotate = rand(0, 360);
  var dur = rand(4, 7) * 1000;
  var delay = rand(0, 2) * 1000;
  var a = el.animate([
    { transform: 'translateY(-10vh) rotate(0deg)', opacity: 0 },
    { opacity: opacity, offset: 0.12 },

function toggleMenu(force) {
  var menu = $('#m-menu');
  var hb = $('#hamburger');
  var open = typeof force === 'boolean' ? force : !menu.classList.contains('open');
  menu.classList.toggle('open', open);
  hb.classList.toggle('open', open);
}

function setActiveNav() {
  var path = currentPath();
  $$('.nav-link').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('href') === '#' + path);
  });
  $$('.m-link').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('href') === '#' + path);
  });
  positionPill();
}

function positionPill() {
  var pill = $('#nav-pill');
  if (!pill) return;
  var active = $('.nav-link.active');
  if (!active) { pill.style.opacity = '0'; return; }
  pill.style.opacity = '1';
  pill.style.left = active.offsetLeft + 'px';
  pill.style.width = active.offsetWidth + 'px';
}

/* ============================================================
   Router
============================================================ */
function currentPath() {
  var h = location.hash.replace(/^#/, '');
  return h && PAGES[h] ? h : '/';
}

var PAGES = {
  '/':          { render: homeHTML, init: homeInit },
  '/love-notes':{ render: loveNotesHTML, init: loveNotesInit },
  '/gallery':   { render: galleryHTML, init: galleryInit },
  '/timeline':  { render: timelineHTML, init: timelineInit },
  '/playlist':  { render: playlistHTML, init: playlistInit },
  '/surprise':  { render: surpriseHTML, init: surpriseInit }
};

function navigate() {
  var path = currentPath();
  var page = PAGES[path];
  var el = $('#page');
  el.innerHTML = page.render();
  anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
  page.init();
  setActiveNav();
  toggleMenu(false);
  window.scrollTo(0, 0);
}

  var root = $('#page');

  anim($('#hero-emoji', root), [{ transform: 'scale(1)' }, { transform: 'scale(1.1)', offset: 0.5 }, { transform: 'scale(1)' }], { duration: 2000, iterations: Infinity, easing: 'ease-in-out' });

  $$('.float-emoji', root).forEach(function (el) {

    el.style.left = x1 + '%';
    el.animate([
      { transform: 'translate(0, 100px)', opacity: 0 },
      { transform: 'translate(' + (x2 - x1) + 'px, 40px)', opacity: 1, offset: 0.3 },
      { transform: 'translate(' + (x3 - x1) + 'px, -20px)', opacity: 1, offset: 0.8 },
      { transform: 'translate(' + (x3 - x1) + 'px, -20px)', opacity: 0 }
    ], { duration: rand(4, 7) * 1000, delay: rand(0, 2) * 1000, iterations: Infinity, easing: 'ease-in-out' });
  });

    ], { duration: 3000, delay: el.dataset.i * 200, iterations: Infinity, easing: 'ease-in-out' });
  });

}

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  var target = nextGirlfriendDay();

  function tick() {
    var now = new Date();
    if (target.getTime() - now.getTime() <= 0) target = nextGirlfriendDay();
    var diff = Math.max(0, target.getTime() - now.getTime());
    var values = {
      Days: Math.floor(diff / 86400000),
      Hours: Math.floor((diff / 3600000) % 24),
      Minutes: Math.floor((diff / 60000) % 60),
      Seconds: Math.floor((diff / 1000) % 60)
    };
    $$('.count-tile .num').forEach(function (el) {
      var v = String(values[el.dataset.lbl]).padStart(2, '0');
      if (el.textContent !== v) {
        el.textContent = v;
        anim(el, [{ transform: 'translateY(-10px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 400 });
      }
    });
  }

  function nextGirlfriendDay() {
    var d = new Date();
    d.setMonth(7); d.setDate(1); d.setHours(0, 0, 0, 0);
    if (d.getTime() <= Date.now()) d.setFullYear(d.getFullYear() + 1);
    return d;
  }

  tick();
  countdownTimer = setInterval(tick, 1000);
}

      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);

  }
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  $('button', card).addEventListener('click', close);
}

    playingId = id;
    $$('.song', root).forEach(function (row) {

      var emojiBox = $('.song-emoji', row);

        emojiBox.className = 'song-emoji soft ' + song2.color;
        emojiBox.innerHTML = '<span>' + song2.emoji + '</span>';
        state.textContent = '\u25B6\uFE0F';
        $('.song-reason', row).style.display = 'none';
      }
    });

    var np = $('#now-playing', root);
    if (playingId) {
      var current = SONGS.find(function (s) { return String(s.id) === String(playingId); });
      $('#np-disc', root).className = 'np-disc animate-spin-slow ' + current.color;
      $('#np-title', root).textContent = current.title;
      $('#np-artist', root).textContent = current.artist;
      np.style.display = 'block';
      anim(np, [{ opacity: 0, transform: 'translateY(-20px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 400 });
      if (scrollIntoView) {
        var rect = np.getBoundingClientRect();
        if (rect.top < 0) np.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    } else {
      np.style.display = 'none';
    }
  }

  $$('.song', root).forEach(function (row, i) {
    anim(row, [{ opacity: 0, transform: 'translateX(-20px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 400, delay: i * 80 });
    row.addEventListener('click', function () {
      setPlaying(playingId === row.dataset.id ? null : row.dataset.id, true);
    });
  });

  $('#np-volume', root).addEventListener('input', function (e) {
    var v = Number(e.target.value);
    var emoji = v === 0 ? '\u{1F507}' : v < 40 ? '\u{1F508}' : '\u{1F50A}';
    var spans = $$('.now-playing span', root);
    if (spans[0]) spans[0].textContent = emoji;
    if (spans[spans.length - 1]) spans[spans.length - 1].textContent = emoji;
  });
}

/* ============================================================
   SURPRISE
============================================================ */
function surpriseHTML() {
  return pageShell(
    '<div class="text-center mb-12">' +
      '<span id="s-emoji" style="display:block;font-size:72px;margin-bottom:16px;cursor:pointer">\u{1F381}</span>' +
      '<h1 class="hd-4xl font-extrabold tg tg-violet-indigo mb-3">A Special Surprise</h1>' +
      '<p class="text-gray-400">Just for you, my love \u{1F49D}</p>' +
    '</div>' +
    '<div id="confetti-layer" style="position:fixed;inset:0;pointer-events:none;z-index:50;display:none"></div>' +
    '<div id="gift-area"></div>' +
    '<div id="gift-content" style="display:none" class="space-y-8"></div>' +
    '<div id="gift-quote"></div>'
  );
}

var surpriseState = { showGift: false, giftOpened: false, promiseIdx: 0, reasonIdx: 0 };

function giftAreaHTML() {
  if (surpriseState.giftOpened) return '';
  var cls = surpriseState.showGift ? 'opening' : 'bounce';
  var label = surpriseState.showGift ? 'Opening...' : 'Tap to open your gift!';
  return '<div class="gift-box">' +
    '<div class="gift-trigger ' + cls + '" id="gift-trigger">' +
      '<div class="relative"><span class="gift">\u{1F381}</span>' +
      (!surpriseState.showGift ? '<span class="gift-sparkle">\u2728</span>' : '') +
      '</div>' +
      '<p class="text-pink-500 font-medium mt-4 animate-pulse">' + label + '</p>' +
    '</div></div>';
}

function giftContentHTML() {
  var promiseNav = '<div class="slide-nav"><button class="slide-btn" data-nav="promise" data-dir="-1">\u2190</button>' +
    '<span class="flex items-center text-sm text-gray-400" style="font-size:14px" id="promise-count">' + (surpriseState.promiseIdx + 1) + ' / ' + PROMISES.length + '</span>' +
    '<button class="slide-btn" data-nav="promise" data-dir="1">\u2192</button></div>';
  var reasonNav = '<div class="slide-nav"><button class="slide-btn purple" data-nav="reason" data-dir="-1">\u2190</button>' +
    '<span class="flex items-center text-sm text-gray-400" style="font-size:14px" id="reason-count">' + (surpriseState.reasonIdx + 1) + ' / ' + REASONS.length + '</span>' +
    '<button class="slide-btn purple" data-nav="reason" data-dir="1">\u2192</button></div>';

  return '' +
    '<div class="slide-card">' +
      '<h2 class="text-2xl font-bold text-center tg tg-rose-pink mb-6" style="font-size:24px">\u{1F48D} My Promises to You</h2>' +
      '<div class="slide-stage"><p id="promise-text">' + PROMISES[surpriseState.promiseIdx] + '</p></div>' +
      promiseNav +
    '</div>' +
    '<div class="slide-card">' +
      '<h2 class="text-2xl font-bold text-center tg tg-fuchsia-purple mb-6" style="font-size:24px">\u{1F497} Why I Love You</h2>' +
      '<div class="slide-stage"><p id="reason-text">' + REASONS[surpriseState.reasonIdx] + '</p></div>' +
      reasonNav +
    '</div>' +
    '<div class="voucher g-rose-pink-fuchsia">' +
      '<span class="v-emoji">\u{1F3AB}</span>' +
      '<h3>Love Voucher</h3>' +
      '<p class="v-intro">This voucher entitles the bearer to:</p>' +
      '<div class="v-items">' +
        '<p>\u2728 Unlimited hugs &amp; kisses</p>' +
        '<p>\u{1F37D}\uFE0F One romantic dinner date</p>' +
        '<p>\u{1F3AC} Movie night of your choice</p>' +
        '<p>\u{1F486} A relaxing massage</p>' +
        '<p>\u{1F31F} And infinite love, forever</p>' +
      '</div>' +
      '<p class="v-note">* No expiration date. Valid for eternity.</p>' +
    '</div>' +
    '<div class="text-center">' +
      '<button id="reopen-gift" class="bg-white/80 backdrop-blur-sm px-8 py-3 rounded-full font-medium text-pink-500 shadow-lg border border-pink-200 hover-bg-pink-50" style="padding:12px 32px;border-radius:999px;color:#ec4899">Open Gift Again \u{1F381}</button>' +
    '</div>';
}

function surpriseInit() {
  var root = $('#page');

  var s = $('#s-emoji', root);
  s.animate([
    { transform: 'scale(1) rotate(0)' },
    { transform: 'scale(1.2) rotate(5deg)', offset: 0.25 },
    { transform: 'scale(1) rotate(0)', offset: 0.5 },
    { transform: 'scale(1.2) rotate(-5deg)', offset: 0.75 },
    { transform: 'scale(1) rotate(0)' }
  ], { duration: 3000, iterations: Infinity, easing: 'ease-in-out' });
  s.addEventListener('click', function () { burstConfetti(); });

  renderSurprise();
}

function renderSurprise() {
  var root = $('#page');
  $('#gift-area', root).innerHTML = giftAreaHTML();
  $('#gift-content', root).innerHTML = surpriseState.giftOpened ? giftContentHTML() : '';
  $('#gift-content', root).style.display = surpriseState.giftOpened ? 'block' : 'none';
  $('#gift-quote', root).innerHTML = (!surpriseState.giftOpened && !surpriseState.showGift)
    ? '<div class="text-center mt-8"><p class="text-gray-400 italic">The best gifts aren\u2019t wrapped in paper \u2014 they\u2019re wrapped in love \u{1F495}</p></div>'
    : '';

  var trigger = $('#gift-trigger', root);
  if (trigger) {
    trigger.addEventListener('click', openGift);
  }

  if (surpriseState.giftOpened) {
    var content = $('#gift-content', root);
    anim(content, [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 500 });
    $$('.slide-btn', content).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var kind = btn.dataset.nav;
        var dir = Number(btn.dataset.dir);
        if (kind === 'promise') {
          var len = PROMISES.length;
          surpriseState.promiseIdx = (surpriseState.promiseIdx + dir + len) % len;
          var txt = $('#promise-text', content);
          txt.textContent = PROMISES[surpriseState.promiseIdx];
          $('#promise-count', content).textContent = (surpriseState.promiseIdx + 1) + ' / ' + len;
          anim(txt, [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 400 });
        } else {
          var len2 = REASONS.length;
          surpriseState.reasonIdx = (surpriseState.reasonIdx + dir + len2) % len2;
          var txt2 = $('#reason-text', content);
          txt2.textContent = REASONS[surpriseState.reasonIdx];
          $('#reason-count', content).textContent = (surpriseState.reasonIdx + 1) + ' / ' + len2;
          anim(txt2, [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 400 });
        }
      });
    });
    $('#reopen-gift', content).addEventListener('click', function () {
      surpriseState.giftOpened = false;
      surpriseState.showGift = false;
      burstConfetti();
      renderSurprise();
    });
  }
}

function openGift() {
  if (surpriseState.showGift || surpriseState.giftOpened) return;
  surpriseState.showGift = true;
  burstConfetti();
  renderSurprise();
  setTimeout(function () {
    surpriseState.giftOpened = true;
    surpriseState.showGift = false;
    renderSurprise();
  }, 2000);
}

function burstConfetti() {
  var layer = $('#confetti-layer');
  if (!layer) return;
  layer.innerHTML = '';
  layer.style.display = 'block';
  for (var i = 0; i < 60; i++) {
    var el = document.createElement('span');
    el.className = 'c-piece';
    el.textContent = CONFETTI_EMOJIS[i % CONFETTI_EMOJIS.length];
    layer.appendChild(el);
    el.animate([
      { transform: 'translate(0,0) scale(0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + rand(-40, 40) + 'vw,' + rand(-40, 40) + 'vh) scale(' + rand(0.5, 2) + ') rotate(' + rand(0, 720) + 'deg)', opacity: 0 }
    ], { duration: rand(2, 4) * 1000, easing: 'ease-out', fill: 'both' });
  }
  setTimeout(function () { if (layer) layer.style.display = 'none'; }, 4200);
}

/* ============================================================
   Unlock flow
============================================================ */
function doUnlock() {
  if (unlocked) return;
  unlocked = true;
  pinTimers.forEach(clearTimeout);
  try { sessionStorage.setItem('gf_day_unlocked', 'true'); } catch (e) {}
  var lock = $('#lock-screen');
  lock.classList.add('gone');
  setTimeout(function () {
    if (lock.parentNode) lock.parentNode.removeChild(lock);
  }, 650);

  var app = $('#app');
  app.style.display = 'block';
  anim(app, [{ opacity: 0 }, { opacity: 1 }], { duration: 600 });
  startFallingHearts();
  navigate();
}

function init() {
  renderNav();

  var already = false;
  try { already = sessionStorage.getItem('gf_day_unlocked') === 'true'; } catch (e) {}

  if (already) {
    doUnlock();
  } else {
    renderLockScreen();
  }

  window.addEventListener('keydown', function (e) {
    if (unlocked) return;
    if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
    else if (e.key === 'Backspace') handleDelete();
    else if (e.key === 'Escape') handleClear();
  });

  window.addEventListener('hashchange', navigate);
}

init();

})();
</script>
</body>
</html>
